<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASHVALE — A Medieval Tale</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Verdana, Geneva, sans-serif; }
  #game { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; user-select: none; }

  #crosshair {
    position: absolute; left: 50%; top: 50%; width: 6px; height: 6px;
    margin: -3px 0 0 -3px; border-radius: 50%;
    background: rgba(255,255,255,.85); box-shadow: 0 0 4px rgba(0,0,0,.8);
  }

  /* minimap + bars, GTA-style bottom-left */
  #mapbox {
    position: absolute; left: 18px; bottom: 18px; width: 232px;
  }
  #minimap {
    width: 232px; height: 148px; border-radius: 10px;
    border: 2px solid rgba(0,0,0,.65); box-shadow: 0 2px 10px rgba(0,0,0,.5);
    background: #12220f;
  }
  .bar { height: 9px; margin-top: 5px; border-radius: 4px; background: rgba(0,0,0,.55); overflow: hidden; border: 1px solid rgba(0,0,0,.6); }
  .bar > div { height: 100%; width: 100%; transition: width .15s linear; }
  #hpfill  { background: linear-gradient(#7ed957,#3f9b2f); }
  #mpfill  { background: linear-gradient(#6db7ff,#2f6fd0); }
  #stfill  { background: linear-gradient(#ffe07a,#d8a530); }

  /* top right: gold + wanted */
  #topright { position: absolute; right: 22px; top: 16px; text-align: right; }
  #gold {
    font: bold 26px 'Impact','Arial Black',sans-serif; letter-spacing: 1px;
    color: #eaeaea; text-shadow: 0 2px 3px rgba(0,0,0,.9);
  }
  #gold span { color: #ffd54a; }
  #stars { margin-top: 4px; font-size: 24px; letter-spacing: 3px;
    color: rgba(255,255,255,.28); text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  #stars .on { color: #ffd54a; }
  #stars.flash .on { animation: starflash .5s infinite; }
  @keyframes starflash { 50% { color: #ff4a4a; } }

  #zone {
    position: absolute; right: 22px; bottom: 96px;
    font: bold 22px 'Impact','Arial Black',sans-serif; color: #f4e9c8;
    text-shadow: 0 2px 4px #000; letter-spacing: 2px; opacity: 0; transition: opacity 1s;
  }

  /* skill bar bottom right */
  #skills { position: absolute; right: 18px; bottom: 18px; display: flex; gap: 8px; }
  .skill {
    width: 58px; height: 58px; border-radius: 9px; position: relative;
    background: rgba(10,12,18,.72); border: 2px solid rgba(255,255,255,.22);
    box-shadow: 0 2px 8px rgba(0,0,0,.5); overflow: hidden; text-align: center;
  }
  .skill .ico { font-size: 26px; line-height: 44px; filter: drop-shadow(0 2px 2px #000); }
  .skill .key {
    position: absolute; left: 3px; top: 2px; font: bold 11px Verdana; color: #ffd54a;
    text-shadow: 0 1px 2px #000;
  }
  .skill .nm {
    position: absolute; bottom: 2px; left: 0; right: 0; font: bold 8px Verdana;
    color: #cfd6e4; text-shadow: 0 1px 2px #000; letter-spacing: .5px;
  }
  .skill .cd {
    position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
    background: rgba(20,30,60,.78); border-top: 1px solid rgba(120,160,255,.5);
  }
  .skill.nomana { border-color: rgba(255,80,80,.45); }

  #prompt {
    position: absolute; left: 50%; bottom: 130px; transform: translateX(-50%);
    font: bold 15px Verdana; color: #fff; text-shadow: 0 2px 3px #000;
    background: rgba(0,0,0,.45); padding: 7px 14px; border-radius: 6px; display: none;
  }
  #prompt b { color: #ffd54a; }

  #msg {
    position: absolute; left: 50%; top: 26%; transform: translateX(-50%);
    font: bold 18px Verdana; color: #ffd54a; text-shadow: 0 2px 4px #000; opacity: 0;
    transition: opacity .4s;
  }

  /* damage vignette */
  #dmg {
    position: absolute; inset: 0; opacity: 0; transition: opacity .35s;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(160,0,0,.55) 100%);
  }

  /* death screen */
  #dead {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.45);
  }
  #dead span {
    font: bold 90px 'Impact','Arial Black',sans-serif; color: #b8b8b8;
    letter-spacing: 6px; text-shadow: 0 4px 12px #000;
  }

  .dmgnum {
    position: absolute; font: bold 15px Verdana; color: #fff;
    text-shadow: 0 1px 2px #000, 0 0 6px rgba(255,120,0,.6); pointer-events: none;
    transition: transform .8s ease-out, opacity .8s linear;
  }

  /* ---------- start / pause menu ---------- */
  #menu {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: linear-gradient(rgba(6,8,14,.55), rgba(6,8,14,.82));
    cursor: pointer;
  }
  #title {
    font: bold 92px 'Impact','Arial Black',sans-serif; letter-spacing: 8px;
    color: #f4e9c8; text-shadow: 0 0 24px rgba(255,190,80,.35), 0 5px 14px #000;
  }
  #subtitle {
    margin-top: 2px; font: italic 18px Georgia, serif; color: #cbb98a; letter-spacing: 4px;
    text-shadow: 0 2px 4px #000;
  }
  #controls {
    margin-top: 34px; display: inline-block; text-align: left;
    background: rgba(10,12,20,.6); border: 1px solid rgba(255,220,150,.25);
    border-radius: 10px; padding: 18px 30px; color: #dcd6c6;
    font: 14px/1.9 Verdana; box-shadow: 0 6px 24px rgba(0,0,0,.5);
  }
  #controls b { color: #ffd54a; display: inline-block; min-width: 118px; }
  #clicktext {
    margin-top: 30px; font: bold 22px Verdana; color: #fff; text-shadow: 0 2px 4px #000;
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse { 50% { opacity: .45; } }
</style>
</head>
<body>
  <div id="game"></div>

  <div id="hud">
    <div id="dmg"></div>
    <div id="crosshair"></div>

    <div id="mapbox">
      <canvas id="minimap" width="232" height="148"></canvas>
      <div class="bar"><div id="hpfill"></div></div>
      <div class="bar"><div id="mpfill"></div></div>
      <div class="bar"><div id="stfill"></div></div>
    </div>

    <div id="topright">
      <div id="gold"><span>$</span> 0</div>
      <div id="stars">★★★★★</div>
    </div>

    <div id="zone"></div>
    <div id="skills"></div>
    <div id="prompt"></div>
    <div id="msg"></div>
    <div id="dead"><span>SLAIN</span></div>
  </div>

  <div id="menu">
    <div id="title">ASHVALE</div>
    <div id="subtitle">A MEDIEVAL TALE OF CRIME &amp; SORCERY</div>
    <div id="controls">
      <b>W A S D</b> Move<br>
      <b>Mouse</b> Look around<br>
      <b>Shift</b> Sprint &nbsp;·&nbsp; <b>Space</b> Jump<br>
      <b>Left Click</b> Sword attack<br>
      <b>1 / 2 / 3 / 4</b> Fireball · Heal · Shadow Step · Thunder<br>
      <b>E</b> Mount / dismount horse<br>
      <b>Esc</b> Menu
    </div>
    <div id="clicktext">CLICK TO PLAY</div>
  </div>

  <script src="lib/three.min.js"></script>
  <script src="lib/BufferGeometryUtils.js"></script>
  <script src="game.js"></script>
</body>
</html>
